name: Release Worker Agent

# Builds the LLMTune Windows worker agent (source in the PRIVATE infra repo —
# checked out with a deploy key, never committed here) into a self-contained
# .exe, packages SHA-256 checksums, and attaches both to a GitHub Release.
# The agent is infrastructure-only: it joins NetBird, probes hardware, derives
# the chassis signature, registers, and heartbeats. It carries NO model names,
# paths, or configuration — model assignment is platform-managed via the admin
# panel / model-assignment API and delivered through heartbeat responses.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout agent source (private infra repo, deploy key)
        uses: actions/checkout@v4
        with:
          repository: llmtune-io/llmtune-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
          sparse-checkout: |
            workers/win-agent

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          if (-not $v -or $v -eq "heads/main") { $v = "0.0.0-dev-${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build self-contained exe (PS2EXE)
        shell: pwsh
        run: |
          Set-Location infra
          powershell -NoProfile -ExecutionPolicy Bypass -File workers/win-agent/Build-LLMTuneWorkerAgent.ps1 -Version ${{ steps.ver.outputs.version }}
          $exe = "workers/workers-win-agent-dist/llmtune-worker-agent-${{ steps.ver.outputs.version }}-win-x64.exe"
          if (-not (Test-Path $exe)) { throw "expected exe missing: $exe" }
          Copy-Item $exe ../

      - name: Guard — no model identifiers in artifacts
        shell: pwsh
        run: |
          $exe = "llmtune-worker-agent-${{ steps.ver.outputs.version }}-win-x64.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $text = [Text.Encoding]::UTF8.GetString($bytes)
          $banned = @("devstral", "mistral", "llama", "qwen", "vllm serve", "model-weights")
          $found = @($banned | Where-Object { $text.ToLower().Contains($_) })
          if ($found.Count -gt 0) { throw "model identifier(s) found in binary: $($found -join ', ')" }
          "clean: no model identifiers in $exe"

      - name: Checksums
        shell: pwsh
        run: |
          $exe = "llmtune-worker-agent-${{ steps.ver.outputs.version }}-win-x64.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $exe" | Out-File -Encoding ascii checksums.txt
          Get-Content checksums.txt

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            llmtune-worker-agent-${{ steps.ver.outputs.version }}-win-x64.exe
            checksums.txt
          generate_release_notes: true
          body: |
            LLMTune Worker Agent v${{ steps.ver.outputs.version }} (Windows x64)

            Infrastructure-only onboarding agent: NetBird join, hardware/GPU probe,
            chassis signature, registration + heartbeat.

            **Models are platform-managed.** This binary contains no model names,
            paths, or configuration. Model assignment is controlled by platform
            administrators via the admin panel / model-assignment API.

            Verify the download against `checksums.txt` (SHA-256).
